# Skyramp Workspace Configuration
workspace:
  repoName: mrugeshmaster/openobserve
  repoUrl: https://github.com/mrugeshmaster/openobserve
metadata:
  schemaVersion: v1
  executorVersion: v1.3.38
  createdAt: "2026-08-13T01:37:53.660Z"
  updatedAt: "2026-08-13T01:37:53.664Z"
services:
  - serviceName: openobserve
    language: javascript
    framework: playwright
    testDirectory: tests/ui-testing/playwright-tests/skyramp
    api:
      schemaPath: http://localhost:5080/api-doc/openapi.json
      authType: basic
      authHeader: Authorization
      baseUrl: http://localhost:5080
    runtimeDetails:
      serverStartCommand: bash .skyramp/sut/setup.sh
      runtime: local
      testSuites:
        - testRunCommand: npx playwright test --reporter=list
          testEnv:
            SKYRAMP_UI_PASSWORD: Complexpass#123
            SKYRAMP_TEST_BASE_URL: http://localhost:5080
